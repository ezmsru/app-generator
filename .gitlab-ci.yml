spec:
  inputs:
    # --- Режим ---
    action:
      type: string
      default: create
      description: "⚙️ РЕЖИМ · create — создать репозитории; delete — удалить. В обоих режимах цель задаётся полями project_name + target_group_name (ниже)"
      options: ["create", "delete"]
    # --- Основное / цель (для обоих режимов) ---
    project_name:
      type: string
      description: "🎯 ЦЕЛЬ · имя репозитория (латиница, без пробелов). create — создаётся; delete — удаляется. Обязателен в обоих режимах"
      regex: '^[a-z0-9][a-z0-9._-]*$'
    target_group_name:
      type: string
      description: "🎯 ЦЕЛЬ · группа-продукт под middle/itbigdata/ и middleconf/itbigdata/ (например: cicdbigdata). create — создастся, если нет; delete — группа, в которой лежит удаляемое репо (сама группа НЕ удаляется). Обязателен в обоих режимах"
      regex: '^[a-z0-9][a-z0-9._-]*$'
    template_type:
      type: string
      default: python-fastapi
      description: "Тип шаблона приложения"
      options: ["python-fastapi", "python-flask", "python-gunicorn", "java", "node"]
    deploy_stands:
      type: string
      default: "DEV"
      description: "🎯 СТЕНДЫ · куда катим: DEV (vlg-t2-dc-s) → +PREPROD (vlg-t2-dc-l) → +PROD (msk-p1-dm-gen + msk-p1-kb-gen)"
      options:
        - "DEV"
        - "DEV + PREPROD"
        - "DEV + PREPROD + PROD"
    # --- PAM ---
    pam_source:
      type: string
      default: ""
      description: "🔐 PAM · путь до секретов /MegaFon/Common/Data-Analytics/<stand(подставляется автоматически)>/<1 уровень>/<2 родительский уровень>/ (например: LLM/cost_scan), где LLM - 1 ур, cost_scan - 2 ур."
    # --- PostgreSQL ---
    pg_enabled:
      type: boolean
      default: false
      description: "🗄️ POSTGRESQL · подключить (порт по умолчанию 5432)"
    pg_host:
      type: string
      default: ""
      description: "PostgreSQL host"
    pg_db:
      type: string
      default: ""
      description: "PostgreSQL database"
    # --- ClickHouse ---
    ch_enabled:
      type: boolean
      default: false
      description: "🔶 CLICKHOUSE · подключить"
    ch_host:
      type: string
      default: ""
      description: "ClickHouse host"
    ch_db:
      type: string
      default: ""
      description: "ClickHouse database"
    # --- Redis ---
    redis_enabled:
      type: boolean
      default: false
      description: "🧱 REDIS · подключить"
    redis_host:
      type: string
      default: ""
      description: "Redis host"
    # --- S3 ---
    s3_enabled:
      type: boolean
      default: false
      description: "☁️ S3 · подключить"
    s3_endpoint_url:
      type: string
      default: ""
      description: "S3 endpoint URL"
    s3_bucket:
      type: string
      default: ""
      description: "S3 bucket"
    s3_prefix:
      type: string
      default: ""
      description: "S3 prefix (например: ocr/)"
    # --- ServiceMonitor (Prometheus) ---
    servicemonitor_enabled:
      type: boolean
      default: false
      description: "📈 SERVICEMONITOR · включить ServiceMonitor(кастомные метрики) (Prometheus scrape /eapi/<app>/manage/prometheus)"
    # --- Удаление (только при action=delete) ---
    delete_password:
      type: string
      default: ""
      description: "🗑️ УДАЛЕНИЕ · пароль подтверждения (нужен при action=delete). Удаляются middle + middleconf репозитории project_name и строка в job-dsl; группа не трогается"
---
include:
  - project: 'middle/itbigdata/devops_tools/gitlab-templates'
    file: 'templates/unixrepo-auth.yml'

default:
  tags:
    - docker-abd

# Генератор управляется только ручным запуском (Run pipeline): и создание,
# и удаление инициируются человеком через форму. Push в репо pipeline не порождает.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - delete
  - validate
  - create-repo
  - register-dsl
  - fill-config
  - fill-template
  - setup-webhook
  - redis-user
  - pg-user

variables:
  GITLAB_URL: "https://cicd-git.megafon.ru"
  CI_IMAGE: "mf-ubi-target-docker-local.unixrepo.megafon.ru/alpine:3.22"
  # --- Маппинг inputs → variables: весь shell ниже использует $VAR как раньше ---
  TARGET_GROUP_NAME: "$[[ inputs.target_group_name ]]"
  PROJECT_NAME: "$[[ inputs.project_name ]]"
  TEMPLATE_TYPE: "$[[ inputs.template_type ]]"
  DEPLOY_STANDS: "$[[ inputs.deploy_stands ]]"
  PAM_SOURCE: "$[[ inputs.pam_source ]]"
  PG_ENABLED: "$[[ inputs.pg_enabled ]]"
  PG_HOST: "$[[ inputs.pg_host ]]"
  PG_DB: "$[[ inputs.pg_db ]]"
  CH_ENABLED: "$[[ inputs.ch_enabled ]]"
  CH_HOST: "$[[ inputs.ch_host ]]"
  CH_DB: "$[[ inputs.ch_db ]]"
  REDIS_ENABLED: "$[[ inputs.redis_enabled ]]"
  REDIS_HOST: "$[[ inputs.redis_host ]]"
  S3_ENABLED: "$[[ inputs.s3_enabled ]]"
  S3_ENDPOINT_URL: "$[[ inputs.s3_endpoint_url ]]"
  S3_BUCKET: "$[[ inputs.s3_bucket ]]"
  S3_PREFIX: "$[[ inputs.s3_prefix ]]"
  SERVICEMONITOR_ENABLED: "$[[ inputs.servicemonitor_enabled ]]"
  ACTION: "$[[ inputs.action ]]"
  # пароль из формы; сверяется с masked CI-переменной DELETE_PASSWORD (задаётся в Settings → CI/CD)
  DELETE_PASSWORD_INPUT: "$[[ inputs.delete_password ]]"


validate-params:
  stage: validate
  image: $CI_IMAGE
  rules:
    - if: $ACTION == "create"
  before_script:
    - !reference [.unixrepo_configuration, auth_apk]
    - apk add --no-cache curl jq
  script:
    - |
      echo "=== Валидация параметров ==="
      [ -z "$PROJECT_NAME" ]      && echo "ERROR: PROJECT_NAME обязателен"      && exit 1
      [ -z "$TARGET_GROUP_NAME" ] && echo "ERROR: TARGET_GROUP_NAME обязателен" && exit 1

      for v in PROJECT_NAME TARGET_GROUP_NAME; do
        eval "val=\"\$$v\""
        
        if ! echo "$val" | grep -qE '^[a-z0-9][a-z0-9._-]*$'; then
          echo "ERROR: ${v}: только a-z, 0-9, ., -, _"
          exit 1
        fi
      done

      # --- Валидация зависимостей: enabled ⇒ обязательные параметры ---
      if [ "$PG_ENABLED" = "true" ]; then
        [ -z "$PG_HOST" ] && echo "ERROR: PG_ENABLED=true, но PG_HOST пуст" && exit 1
        [ -z "$PG_DB" ]   && echo "ERROR: PG_ENABLED=true, но PG_DB пуст"   && exit 1
      fi
      if [ "$REDIS_ENABLED" = "true" ]; then
        [ -z "$REDIS_HOST" ] && echo "ERROR: REDIS_ENABLED=true, но REDIS_HOST пуст" && exit 1
      fi
      if [ "$CH_ENABLED" = "true" ]; then
        [ -z "$CH_HOST" ] && echo "ERROR: CH_ENABLED=true, но CH_HOST пуст" && exit 1
        [ -z "$CH_DB" ]   && echo "ERROR: CH_ENABLED=true, но CH_DB пуст"   && exit 1
      fi
      if [ "$S3_ENABLED" = "true" ]; then
        [ -z "$S3_ENDPOINT_URL" ] && echo "ERROR: S3_ENABLED=true, но S3_ENDPOINT_URL пуст" && exit 1
        [ -z "$S3_BUCKET" ]       && echo "ERROR: S3_ENABLED=true, но S3_BUCKET пуст"       && exit 1
      fi
      # PAM_SOURCE обязателен, если включена любая интеграция с секретом из PAM
      if [ "$PG_ENABLED" = "true" ] || [ "$REDIS_ENABLED" = "true" ] || [ "$S3_ENABLED" = "true" ]; then
        [ -z "$PAM_SOURCE" ] && echo "ERROR: включена интеграция с PAM-секретом (PG/Redis/S3), но PAM_SOURCE пуст" && exit 1
      fi

      # --- DEPLOY_STANDS (дружелюбные имена) → конкретные DC-стенды ---
      # DC_STANDS — список файлов <dc>-values.yaml; прокидывается дальше через dotenv.
      case "$DEPLOY_STANDS" in
        "DEV")                  DC_STANDS="vlg-t2-dc-s" ;;
        "DEV + PREPROD")        DC_STANDS="vlg-t2-dc-s,vlg-t2-dc-l" ;;
        "DEV + PREPROD + PROD") DC_STANDS="vlg-t2-dc-s,vlg-t2-dc-l,msk-p1-dm-gen,msk-p1-kb-gen" ;;
        *) echo "ERROR: неизвестный deploy_stands '${DEPLOY_STANDS}' (ожидается: DEV | DEV + PREPROD | DEV + PREPROD + PROD)"; exit 1 ;;
      esac
      echo "DEPLOY_STANDS='${DEPLOY_STANDS}' → DC_STANDS='${DC_STANDS}'"
      echo "DC_STANDS=${DC_STANDS}" >> group.env

      # --- Резолв/создание целевых групп: middle + middleconf ---
      # middle и middleconf — независимые root-группы с разными ТУЗами
      for PARENT in middle middleconf; do
        PARENT_PATH="${PARENT}/itbigdata"
        GROUP_PATH="${PARENT_PATH}/${TARGET_GROUP_NAME}"
        ENCODED=$(echo "$GROUP_PATH" | sed 's|/|%2F|g')

        if [ "$PARENT" = "middleconf" ]; then
          TOKEN="${GITLAB_MIDDLECONF_TUZ_TOKEN}"
        else
          TOKEN="${GITLAB_TUZ_TOKEN}"
        fi
        [ -z "$TOKEN" ] && echo "ERROR: пустой токен для ${PARENT}" && exit 1

        GROUP_ID=$(curl -s --header "PRIVATE-TOKEN: ${TOKEN}" \
          "${GITLAB_URL}/api/v4/groups/${ENCODED}" | jq -r '.id // empty')

        if [ -z "$GROUP_ID" ]; then
          PARENT_ENCODED=$(echo "$PARENT_PATH" | sed 's|/|%2F|g')
          PARENT_RESP=$(curl -s -w "\n%{http_code}" --header "PRIVATE-TOKEN: ${TOKEN}" \
            "${GITLAB_URL}/api/v4/groups/${PARENT_ENCODED}")
          PARENT_CODE=$(echo "$PARENT_RESP" | tail -n1)
          PARENT_BODY=$(echo "$PARENT_RESP" | sed '$d')
          PARENT_ID=$(echo "$PARENT_BODY" | jq -r '.id // empty')
          if [ -z "$PARENT_ID" ]; then
            echo "ERROR: родитель ${PARENT_PATH} не найден (HTTP ${PARENT_CODE})"
            echo "Ответ API: ${PARENT_BODY}"
            echo "Подсказка: если группа существует, но HTTP 404 — у ТУЗа нет прав на ${PARENT_PATH}. Добавьте TUZ как Maintainer/Owner в группу."
            exit 1
          fi

          # visibility=private: подгруппа НЕ может быть публичнее private-родителя
          # (itbigdata — private), плюс уровень internal ограничен админом GitLab.
          # private допустим всегда (равно или строже родителя).
          CREATE=$(curl -s --request POST \
            --header "PRIVATE-TOKEN: ${TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"name\": \"${TARGET_GROUP_NAME}\", \"path\": \"${TARGET_GROUP_NAME}\", \"parent_id\": ${PARENT_ID}, \"visibility\": \"private\"}" \
            "${GITLAB_URL}/api/v4/groups")
          GROUP_ID=$(echo "$CREATE" | jq -r '.id // empty')
          if [ -z "$GROUP_ID" ]; then
            echo "ERROR создания группы ${GROUP_PATH}:"; echo "$CREATE" | jq .; exit 1
          fi
          echo "OK: создана группа ${GROUP_PATH} (ID=${GROUP_ID})"
        else
          echo "OK: группа ${GROUP_PATH} найдена (ID=${GROUP_ID})"
        fi

        # Проверка что проект не существует
        ENCODED_PATH=$(echo "${GROUP_PATH}/${PROJECT_NAME}" | sed 's|/|%2F|g')
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
          --header "PRIVATE-TOKEN: ${TOKEN}" \
          "${GITLAB_URL}/api/v4/projects/${ENCODED_PATH}")

        if [ "$HTTP_CODE" = "200" ]; then
          echo "INFO: проект ${PROJECT_NAME} уже существует в ${GROUP_PATH} — будет переиспользован (идемпотентный redeploy)"
        fi

        UPPER=$(echo "$PARENT" | tr '[:lower:]' '[:upper:]')
        echo "${UPPER}_GROUP_ID=${GROUP_ID}"     >> group.env
        echo "${UPPER}_GROUP_PATH=${GROUP_PATH}" >> group.env
      done
      echo "OK: валидация пройдена"
  artifacts:
    reports:
      dotenv: group.env


create-repo:
  stage: create-repo
  image: $CI_IMAGE
  needs: [validate-params]
  rules:
    - if: $ACTION == "create"
  before_script:
    - !reference [.unixrepo_configuration, auth_apk]
    - apk add --no-cache curl jq
  script:
    - |
      GREEN=$(printf '\033[32m'); BOLD=$(printf '\033[1m'); RESET=$(printf '\033[0m')

      # Человеческое имя проекта: slug → Title Case с пробелами.
      # path (slug в URL) остаётся = PROJECT_NAME, а name отображается красиво.
      # coach-bot-orchestrator-runner → Coach Bot Orchestrator Runner
      DISPLAY_NAME=$(printf '%s' "${PROJECT_NAME}" | tr '_.-' '   ' \
        | awk '{for(i=1;i<=NF;i++){$i=toupper(substr($i,1,1)) substr($i,2)}; print}')
      echo "Имя проекта (GitLab): ${DISPLAY_NAME}  |  slug: ${PROJECT_NAME}"

      # get-or-create: если проект уже есть (redeploy) — переиспользуем, не создаём дубль
      create_project() {
        local NS_ID="$1"; local DESC="$2"; local TOKEN="$3"; local GROUP_PATH="$4"
        local ENC; ENC=$(echo "${GROUP_PATH}/${PROJECT_NAME}" | sed 's|/|%2F|g')
        local EXIST; EXIST=$(curl -s --header "PRIVATE-TOKEN: ${TOKEN}" \
          "${GITLAB_URL}/api/v4/projects/${ENC}")
        if [ "$(echo "$EXIST" | jq -r '.id // empty')" != "" ]; then
          echo "$EXIST"
          return 0
        fi
        curl -s --request POST \
          --header "PRIVATE-TOKEN: ${TOKEN}" \
          --header "Content-Type: application/json" \
          --data "{
            \"name\": \"${DISPLAY_NAME}\",
            \"path\": \"${PROJECT_NAME}\",
            \"namespace_id\": ${NS_ID},
            \"description\": \"${DESC}\",
            \"visibility\": \"private\",
            \"initialize_with_readme\": true,
            \"default_branch\": \"master\"
          }" \
          "${GITLAB_URL}/api/v4/projects"
      }

      R1=$(create_project "${MIDDLE_GROUP_ID}" "${TEMPLATE_TYPE} service (app)" "${GITLAB_TUZ_TOKEN}" "${MIDDLE_GROUP_PATH}")
      MIDDLE_PROJECT_ID=$(echo "$R1" | jq -r '.id')
      MIDDLE_PROJECT_WEB=$(echo "$R1" | jq -r '.web_url')
      if [ "$MIDDLE_PROJECT_ID" = "null" ] || [ -z "$MIDDLE_PROJECT_ID" ]; then
        echo "ERROR создания middle:"; echo "$R1" | jq .; exit 1
      fi

      R2=$(create_project "${MIDDLECONF_GROUP_ID}" "${TEMPLATE_TYPE} service (config)" "${GITLAB_MIDDLECONF_TUZ_TOKEN}" "${MIDDLECONF_GROUP_PATH}")
      MIDDLECONF_PROJECT_ID=$(echo "$R2" | jq -r '.id')
      MIDDLECONF_PROJECT_WEB=$(echo "$R2" | jq -r '.web_url')
      if [ "$MIDDLECONF_PROJECT_ID" = "null" ] || [ -z "$MIDDLECONF_PROJECT_ID" ]; then
        echo "ERROR создания middleconf:"; echo "$R2" | jq .; exit 1
      fi

      echo "${GREEN}${BOLD}========================================${RESET}"
      echo "${GREEN}${BOLD}  РЕПОЗИТОРИИ СОЗДАНЫ${RESET}"
      echo "${GREEN}  middle     : ID=${MIDDLE_PROJECT_ID} URL=${MIDDLE_PROJECT_WEB}${RESET}"
      echo "${GREEN}  middleconf : ID=${MIDDLECONF_PROJECT_ID} URL=${MIDDLECONF_PROJECT_WEB}${RESET}"
      echo "${GREEN}${BOLD}========================================${RESET}"

      {
        echo "MIDDLE_PROJECT_ID=${MIDDLE_PROJECT_ID}"
        echo "MIDDLE_PROJECT_WEB=${MIDDLE_PROJECT_WEB}"
        echo "MIDDLECONF_PROJECT_ID=${MIDDLECONF_PROJECT_ID}"
        echo "MIDDLECONF_PROJECT_WEB=${MIDDLECONF_PROJECT_WEB}"
        echo "MIDDLE_GROUP_PATH=${MIDDLE_GROUP_PATH}"
        echo "MIDDLECONF_GROUP_PATH=${MIDDLECONF_GROUP_PATH}"
      } >> create.env
  artifacts:
    reports:
      dotenv: create.env


fill-template:
  stage: fill-template
  image: $CI_IMAGE
  # сериализуем параллельные запуски одного проекта (иначе гонка имён develop-N)
  resource_group: "middle-${PROJECT_NAME}"
  needs:
    - job: create-repo
      artifacts: true
    # ждём, чтобы MR в job-dsl был уже создан (register-in-dsl), затем пауза на его слияние
    - register-in-dsl
  rules:
    - if: $ACTION == "create"
  before_script:
    - !reference [.unixrepo_configuration, auth_apk]
    - apk add --no-cache git curl
    - git config --global user.email "cicd-generator@megafon.ru"
    - git config --global user.name "CICD Generator"
  script:
    - |
      TEMPLATE_DIR="middle/${TEMPLATE_TYPE}"
      [ ! -d "$TEMPLATE_DIR" ] && echo "ERROR: нет шаблона ${TEMPLATE_TYPE}" && exit 1

      git clone "https://oauth2:${GITLAB_TUZ_TOKEN}@cicd-git.megafon.ru/${MIDDLE_GROUP_PATH}/${PROJECT_NAME}.git" new-project

      # Ждём, пока инициализируется master (initialize_with_readme — асинхронно)
      i=0
      until git -C new-project rev-parse -q --verify origin/master >/dev/null 2>&1; do
        i=$((i+1)); [ "$i" -gt 30 ] && { echo "ERROR: master не инициализировался за ~60с"; exit 1; }
        echo "ждём инициализации репо (master)... попытка $i"; sleep 2
        git -C new-project fetch -q origin || true
      done

      # Ветка на каждый запуск (старые не трогаем): develop → develop-2 → develop-3 ...
      # Ответвляемся от README-коммита (чистая база).
      cd new-project
      ROOT=$(git rev-list --max-parents=0 origin/master | tail -1)
      if ! git ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
        TARGET_BRANCH="develop"
      else
        N=2
        while git ls-remote --exit-code --heads origin "develop-${N}" >/dev/null 2>&1; do N=$((N+1)); done
        TARGET_BRANCH="develop-${N}"
      fi
      git checkout -b "${TARGET_BRANCH}" "${ROOT}"
      echo "middle target branch: ${TARGET_BRANCH}"
      cd ..

      cp -r "${TEMPLATE_DIR}"/. new-project/

      find new-project/ -type f \( -name "*.py" -o -name "*.java" -o -name "*.js" \
        -o -name "*.json" -o -name "*.xml" -o -name "*.yml" -o -name "*.yaml" \
        -o -name "*.toml" -o -name "*.txt" -o -name "*.md" \) \
        -exec sed -i "s/{{PROJECT_NAME}}/${PROJECT_NAME}/g" {} +

      # Контент: ветка + шаблон + коммит.
      cd new-project
      git add -A
      git commit -m "feat: init from ${TEMPLATE_TYPE} template (branch ${TARGET_BRANCH})"

      # 0) PUSH 1 — создаём ветку на удалёнке (branch-CREATE, commit_previous_id=0000…0).
      #    Деплой такие события ИГНОРИРУЕТ by design — это нормально, тег здесь НЕ вешаем.
      #    Нужен лишь чтобы триггерящий push (ниже) был branch-UPDATE существующей ветки.
      git push origin "${TARGET_BRANCH}"
      echo "branch pushed (create): ${TARGET_BRANCH} — деплой это событие игнорирует, ждём джобу"

      # 1) Ждём появления продукта в job-dsl master (MR из register-in-dsl ~2 мин).
      #    Триггерящий push делаем ПОЗЖЕ — чтобы он пришёл уже после того,
      #    как Jenkins-сид создал деплой-джобу (иначе хук уходит впустую).
      PRODUCT_DSL="${PRODUCT_NAME:-$TARGET_GROUP_NAME}"
      DSL_GIT="https://${UNIXREPO_USER}:${MF_BDATA_TUZ_PASSWORD}@cicd-git.megafon.ru/libs/cicd/nmf/nmf-job-dsl.git"
      DSL_REL="middle/itbigdata/${PRODUCT_DSL}.yaml"
      echo "Ждём регистрации ${PROJECT_NAME} в job-dsl master..."
      i=0
      until rm -rf /tmp/dsl-poll && \
            git clone -q --depth 1 --branch master "${DSL_GIT}" /tmp/dsl-poll 2>/dev/null && \
            grep -q "\"${PROJECT_NAME}\"" "/tmp/dsl-poll/${DSL_REL}" 2>/dev/null; do
        i=$((i+1))
        if [ "$i" -gt 60 ]; then
          echo "WARN: не дождались регистрации за ~5 мин — продолжаем"
          break
        fi
        echo "  ещё не зарегистрирован, ждём... (попытка $i)"
        sleep 5
      done
      rm -rf /tmp/dsl-poll
      [ "$i" -le 60 ] && echo "OK: продукт в job-dsl master"

      # 2) Активно ждём, пока Jenkins-сид создаст деплой-джобу нашего сервиса.
      #    Папка ИС может уже существовать от других сервисов — поэтому проверяем
      #    появление джобы именно "${PROJECT_NAME}" внутри неё, а не саму папку.
      #    Авторизация ТУЗа — basic auth (UNIXREPO_USER + MF_BDATA_TUZ_PASSWORD).
      #    Слепых sleep-буферов нет: готовность определяем ТОЛЬКО мониторингом
      #    (Stage A — папка репо, Stage B — джобы внутри), затем сразу тег+пуш.
      # ВАЖНО: в Jenkins каждый вложенный уровень адресуется через /job/<name>,
      # поэтому перед сегментом ИС тоже нужен /job/ (.../job/itbigdata/job/<ИС>).
      JENKINS_FOLDER="https://jenkins.middle.megafon.ru/job/middle/job/itbigdata/job/${TARGET_GROUP_NAME}"
      if [ -n "${UNIXREPO_USER}" ] && [ -n "${MF_BDATA_TUZ_PASSWORD}" ]; then
        echo "Ждём создания деплой-джобы ${PROJECT_NAME} в Jenkins (${JENKINS_FOLDER})..."
        JAPI="${JENKINS_FOLDER}/api/json?tree=jobs[name]"
        j=0
        while :; do
          # -g: ОБЯЗАТЕЛЬНО — иначе curl трактует [name] в tree=jobs[name] как
          #     glob-диапазон и молча ломает запрос (пустой ответ, вечный цикл).
          # -L: следуем редиректам; код и тело разбираем отдельно, чтобы видеть,
          #     200 это / 401 / 403 / редирект, а не молча падать как раньше (-sf).
          RESP=$(curl -sS -g -L -w '\n%{http_code}' \
            -u "${UNIXREPO_USER}:${MF_BDATA_TUZ_PASSWORD}" "${JAPI}" 2>/dev/null || true)
          CODE=$(printf '%s' "${RESP}" | tail -n1)
          BODY=$(printf '%s' "${RESP}" | sed '$d')
          if [ "${CODE}" = "200" ] && printf '%s' "${BODY}" | grep -q "\"name\":\"${PROJECT_NAME}\""; then
            echo "OK: деплой-джоба ${PROJECT_NAME} создана в Jenkins"
            break
          fi
          j=$((j+1))
          if [ "${j}" -gt 60 ]; then
            echo "WARN: джоба ${PROJECT_NAME} не появилась за ~5 мин (последний HTTP=${CODE}) — продолжаем"
            break
          fi
          echo "  джобы ещё нет (HTTP=${CODE}), ждём... (попытка ${j})"
          sleep 5
        done
        # STAGE B: папка репозитория есть, НО пайплайн-джобы ВНУТРИ неё (и их
        # SCM-триггеры) сид создаёт заметно позже (~60-120с по наблюдениям) —
        # пуш до этого момента уходит впустую. Фиксированный sleep ненадёжен
        # (время сида плавает), поэтому ждём появления хотя бы одной внутренней
        # джобы — это прямой сигнал, что сид доехал до создания пайплайнов.
        JINNER="${JENKINS_FOLDER}/job/${PROJECT_NAME}/api/json?tree=jobs[name]"
        echo "Папка ${PROJECT_NAME} есть — ждём появления пайплайн-джоб внутри неё..."
        k=0
        while :; do
          IRESP=$(curl -sS -g -L -w '\n%{http_code}' \
            -u "${UNIXREPO_USER}:${MF_BDATA_TUZ_PASSWORD}" "${JINNER}" 2>/dev/null || true)
          ICODE=$(printf '%s' "${IRESP}" | tail -n1)
          IBODY=$(printf '%s' "${IRESP}" | sed '$d')
          # есть хотя бы один вложенный job (любое "name":"...") → сид создал пайплайны
          if [ "${ICODE}" = "200" ] && printf '%s' "${IBODY}" | grep -q '"name":"'; then
            echo "OK: внутри ${PROJECT_NAME} появились пайплайн-джобы"
            break
          fi
          k=$((k+1))
          if [ "${k}" -gt 48 ]; then
            echo "WARN: пайплайн-джобы внутри ${PROJECT_NAME} не появились за ~4 мин (HTTP=${ICODE}) — продолжаем"
            break
          fi
          echo "  внутренних джоб ещё нет (HTTP=${ICODE}), ждём... (попытка ${k})"
          sleep 5
        done
        # Джобы внутри есть — слепой буфер НЕ нужен, триггерим сразу.
        echo "Пайплайн-джобы готовы — триггерим без задержки"
      else
        echo "WARN: креды Jenkins не заданы — мониторинг невозможен, триггерим как есть"
      fi

      # 3) Первая свободная версия 1.0.X (теги репо-глобальные). На свежем репо → 1.0.0.
      #    1.0.X — удобная монотонная схема (фильтра по major в ядре нет).
      #    `|| true`: на свежем репо grep не находит тегов и под pipefail валит джобу.
      LAST=$(git ls-remote --tags origin '1.0.*' 2>/dev/null \
        | sed 's#.*refs/tags/1\.0\.##; s/\^{}//' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
      LAST=${LAST:--1}
      TAG="1.0.$((LAST+1))"

      # 4) PUSH 2 (триггер) — ТОЛЬКО СЕЙЧАС, когда деплой-джоба в Jenkins уже есть.
      #    Делаем НОВЫЙ коммит (двигаем ref ветки) + тег и пушим: для вебхукера это
      #    branch-UPDATE с реальным commit_previous_id → деплой стартует.
      #    Это и есть автоэмуляция ручного «новый коммит + тег в develop».
      printf '%s\n' "${TAG}" > VERSION
      git add VERSION
      git commit -m "chore: trigger deploy ${TAG}"
      git tag "${TAG}"
      git push origin "${TARGET_BRANCH}" "${TAG}"
      echo "trigger pushed (branch-update + ${TAG}) — деплой должен стартовать"

      # 5) Делаем ветку с контентом дефолтной в app-репо.
      #    Иначе при клоне разработчик попадает на master (только README) и думает,
      #    что «ничего не создалось». master НЕ удаляем — prod-flow (MR в master)
      #    остаётся рабочим, просто он больше не дефолтный.
      if curl -sf --request PUT --header "PRIVATE-TOKEN: ${GITLAB_TUZ_TOKEN}" \
           --data "default_branch=${TARGET_BRANCH}" \
           "${GITLAB_URL}/api/v4/projects/${MIDDLE_PROJECT_ID}" >/dev/null; then
        echo "default branch app-репо → ${TARGET_BRANCH}"
      else
        echo "WARN: не удалось сменить default branch на ${TARGET_BRANCH} (проверьте права ТУЗа)"
      fi


fill-config:
  stage: fill-config
  image: $CI_IMAGE
  # сериализуем параллельные запуски одного проекта (иначе гонка имён master-N)
  resource_group: "middleconf-${PROJECT_NAME}"
  needs:
    - job: create-repo
      artifacts: true
    - job: validate-params
      artifacts: true
  rules:
    - if: $ACTION == "create"
  before_script:
    - !reference [.unixrepo_configuration, auth_apk]
    - apk add --no-cache git
    - git config --global user.email "cicd-generator@megafon.ru"
    - git config --global user.name "CICD Generator"
  script:
    - |
      git clone "https://oauth2:${GITLAB_MIDDLECONF_TUZ_TOKEN}@cicd-git.megafon.ru/${MIDDLECONF_GROUP_PATH}/${PROJECT_NAME}.git" new-project

      # Ждём, пока инициализируется master (initialize_with_readme — асинхронно)
      i=0
      until git -C new-project rev-parse -q --verify origin/master >/dev/null 2>&1; do
        i=$((i+1)); [ "$i" -gt 30 ] && { echo "ERROR: master не инициализировался за ~60с"; exit 1; }
        echo "ждём инициализации репо (master)... попытка $i"; sleep 2
        git -C new-project fetch -q origin || true
      done

      # Новая ветка на каждый запуск (старые не трогаем): master → master-2 → master-3 ...
      # master (только README) — первый прогон; далее ответвляемся от README-коммита.
      cd new-project
      ROOT=$(git rev-list --max-parents=0 origin/master | tail -1)
      if [ "$(git rev-list --count origin/master)" = "1" ]; then
        TARGET_BRANCH="master"
        git checkout master
      else
        N=2
        while git ls-remote --exit-code --heads origin "master-${N}" >/dev/null 2>&1; do N=$((N+1)); done
        TARGET_BRANCH="master-${N}"
        git checkout -b "${TARGET_BRANCH}" "${ROOT}"
      fi
      echo "middleconf target branch: ${TARGET_BRANCH}"
      cd ..

      # Dockerfile
      cp "middleconf/${TEMPLATE_TYPE}/Dockerfile" new-project/Dockerfile

      # Файлы сборки MfactoryCI (config.yaml + Makefile) — обязательны для buildpack.
      # python: общие из common-python (+ entrypoint.sh); java/node: свои из middleconf/<type>.
      case "${TEMPLATE_TYPE}" in
        python-*)
          cp middleconf/common-python/entrypoint.sh new-project/entrypoint.sh
          cp middleconf/common-python/config.yaml   new-project/config.yaml
          cp middleconf/common-python/Makefile      new-project/Makefile
          chmod +x new-project/entrypoint.sh
          ;;
        java|node)
          cp "middleconf/${TEMPLATE_TYPE}/config.yaml" new-project/config.yaml
          cp "middleconf/${TEMPLATE_TYPE}/Makefile"    new-project/Makefile
          ;;
      esac

      # Helm chart (mfactorylib)
      mkdir -p new-project/helm/templates
      cp middleconf/helm-base/Chart.yaml           new-project/helm/Chart.yaml
      cp middleconf/helm-base/values.yaml          new-project/helm/values.yaml
      cp middleconf/helm-base/templates/all.yaml            new-project/helm/templates/all.yaml
      cp middleconf/helm-base/templates/servicemonitor.yaml new-project/helm/templates/servicemonitor.yaml

      # DC-стенд-специфичные values: DC_STANDS (из validate-params) перечисляет
      # DC-стенды = имена файлов <dc>-values.yaml. Берём уникальный набор.
      UNIQUE_DCS=$(echo "${DC_STANDS}" | tr ',' '\n' | grep -v '^$' | sort -u)
      for dc in $UNIQUE_DCS; do
        SRC_FILE="middleconf/helm-base/${dc}-values.yaml"
        [ ! -f "$SRC_FILE" ] && echo "ERROR: нет values-файла для DC-стенда '${dc}'" && exit 1
        cp "$SRC_FILE" "new-project/helm/${dc}-values.yaml"
        echo "OK: скопирован ${dc}-values.yaml"
      done

      # --- Условное удаление секций по *_ENABLED ---
      # Каждая интеграция в values обёрнута маркерами "# >>> <name>" / "# <<< <name>"
      # (и в pam.secrets, и в env). Если флаг != true — блок вырезается целиком,
      # чтобы под не падал на отсутствующем PAM-секрете неиспользуемой интеграции.
      strip_section() {
        sec="$1"; flag="$2"
        if [ "$flag" != "true" ]; then
          for vf in new-project/helm/*-values.yaml; do
            [ -f "$vf" ] || continue
            sed -i "/# >>> ${sec}/,/# <<< ${sec}/d" "$vf"
          done
          echo "section ${sec}: вырезана (enabled=${flag})"
        else
          echo "section ${sec}: оставлена (enabled=${flag})"
        fi
      }
      strip_section postgres   "${PG_ENABLED}"
      strip_section redis      "${REDIS_ENABLED}"
      strip_section clickhouse "${CH_ENABLED}"
      strip_section s3         "${S3_ENABLED}"

      # Если не включена ни одна секрето-несущая интеграция (PG/Redis/S3) —
      # вырезаем весь pam-блок, чтобы не создавался пустой ExternalSecret.
      if [ "$PG_ENABLED" != "true" ] && [ "$REDIS_ENABLED" != "true" ] && [ "$S3_ENABLED" != "true" ]; then
        for vf in new-project/helm/*-values.yaml; do
          [ -f "$vf" ] || continue
          sed -i "/# >>> pam/,/# <<< pam/d" "$vf"
        done
        echo "pam: вырезан (нет включённых секретов)"
      fi

      # Убираем строки-маркеры у оставшихся (включённых) секций
      # и схлопываем подряд идущие пустые строки (косметика после вырезания).
      # Squeeze делаем через sed (busybox cat не знает -s; in-place, без .tmp).
      for vf in new-project/helm/*-values.yaml; do
        [ -f "$vf" ] || continue
        sed -i '/# >>> /d;/# <<< /d' "$vf"
        sed -i '/^$/N;/^\n$/D' "$vf"
      done

      # Порт по типу шаблона
      case "${TEMPLATE_TYPE}" in
        java) SERVICE_PORT=8080 ;;
        node) SERVICE_PORT=3000 ;;
        *)    SERVICE_PORT=8000 ;;
      esac

      # Подстановка плейсхолдеров.
      # Значения — свободный ввод, поэтому экранируем спецсимволы sed-замены (\ & |)
      # и используем единый разделитель | (значения хостов/URL/путей могут содержать /).
      esc() { printf '%s' "$1" | sed -e 's/[\\&|]/\\&/g'; }
      find new-project/helm/ new-project/Dockerfile -type f -exec sed -i \
        -e "s|{{PROJECT_NAME}}|$(esc "$PROJECT_NAME")|g" \
        -e "s|{{TARGET_GROUP_NAME}}|$(esc "$TARGET_GROUP_NAME")|g" \
        -e "s|{{SERVICE_PORT}}|$(esc "$SERVICE_PORT")|g" \
        -e "s|{{PG_ENABLED}}|$(esc "$PG_ENABLED")|g" \
        -e "s|{{PG_HOST}}|$(esc "$PG_HOST")|g" \
        -e "s|{{PG_DB}}|$(esc "$PG_DB")|g" \
        -e "s|{{REDIS_ENABLED}}|$(esc "$REDIS_ENABLED")|g" \
        -e "s|{{REDIS_HOST}}|$(esc "$REDIS_HOST")|g" \
        -e "s|{{CH_ENABLED}}|$(esc "$CH_ENABLED")|g" \
        -e "s|{{CH_HOST}}|$(esc "$CH_HOST")|g" \
        -e "s|{{CH_DB}}|$(esc "$CH_DB")|g" \
        -e "s|{{S3_ENABLED}}|$(esc "$S3_ENABLED")|g" \
        -e "s|{{S3_ENDPOINT_URL}}|$(esc "$S3_ENDPOINT_URL")|g" \
        -e "s|{{S3_BUCKET}}|$(esc "$S3_BUCKET")|g" \
        -e "s|{{S3_PREFIX}}|$(esc "$S3_PREFIX")|g" \
        -e "s|{{SERVICEMONITOR_ENABLED}}|$(esc "$SERVICEMONITOR_ENABLED")|g" \
        -e "s|{{PAM_SOURCE}}|$(esc "$PAM_SOURCE")|g" \
        {} +

      cd new-project
      # подстраховка: не коммитим случайные временные файлы
      find . -name '*.tmp' -delete
      git add -A
      git commit -m "feat: middleconf (Dockerfile + mfactorylib helm, stands: ${DEPLOY_STANDS}, branch ${TARGET_BRANCH})"
      git push origin "${TARGET_BRANCH}"


setup-webhook:
  stage: setup-webhook
  image: $CI_IMAGE
  needs:
    - job: create-repo
      artifacts: true
  rules:
    - if: $ACTION == "create"
  variables:
    WEBHOOK_URL: "https://jenkins.middle.megafon.ru/cicd-lib-webhooker/gitlab"
  before_script:
    - !reference [.unixrepo_configuration, auth_apk]
    - apk add --no-cache curl jq
  script:
    - |
      set_webhook() {
        local PID="$1"; local TOKEN="$2"
        echo "=== webhook → project ${PID} ==="
        # дедуп: если хук с таким URL уже есть — не плодим дубль
        local EXISTING
        EXISTING=$(curl -s --header "PRIVATE-TOKEN: ${TOKEN}" \
          "${GITLAB_URL}/api/v4/projects/${PID}/hooks" \
          | jq -r --arg u "${WEBHOOK_URL}" '.[] | select(.url==$u) | .id' | head -n1)
        if [ -n "$EXISTING" ]; then
          echo "webhook уже существует (id=${EXISTING}) — пропуск"
          return 0
        fi
        curl -s --request POST \
          --header "PRIVATE-TOKEN: ${TOKEN}" \
          --header "Content-Type: application/json" \
          --data "{
            \"url\": \"${WEBHOOK_URL}\",
            \"push_events\": true,
            \"push_events_branch_filter\": \"\",
            \"push_events_branch_filter_strategy\": \"all_branches\",
            \"note_events\": true,
            \"merge_requests_events\": true,
            \"enable_ssl_verification\": true
          }" \
          "${GITLAB_URL}/api/v4/projects/${PID}/hooks" | jq .
      }

      set_webhook "${MIDDLE_PROJECT_ID}" "${GITLAB_TUZ_TOKEN}"


register-in-dsl:
  stage: register-dsl
  image: $CI_IMAGE
  # Общий слот на запись в nmf-job-dsl: create/delete от РАЗНЫХ пайплайнов идут
  # строго по одному → нет параллельных правок файла продукта и конфликтов мёржа.
  resource_group: "nmf-job-dsl"
  needs:
    - job: create-repo
      artifacts: true
  rules:
    - if: $ACTION == "create"
  variables:
    DSL_REPO_PATH: "libs/cicd/nmf/nmf-job-dsl"
    DSL_FILE_DIR: "middle/itbigdata"
    DSL_TARGET_BRANCH: "master"
  before_script:
    - !reference [.unixrepo_configuration, auth_apk]
    - apk add --no-cache git python3 py3-ruamel.yaml
    - git config --global user.email "it-reporting-deployment-devops@megafon.ru"
    - git config --global user.name "CICD Generator"
  script:
    - |
      PRODUCT="${PRODUCT_NAME:-$TARGET_GROUP_NAME}"
      FEATURE_BRANCH="feature/${PROJECT_NAME}"
      git clone --branch "${DSL_TARGET_BRANCH}" \
        "https://${UNIXREPO_USER}:${MF_BDATA_TUZ_PASSWORD}@cicd-git.megafon.ru/${DSL_REPO_PATH}.git" dsl-repo
      cd dsl-repo
      git checkout "${FEATURE_BRANCH}" 2>/dev/null || git checkout -b "${FEATURE_BRANCH}"
      mkdir -p "${DSL_FILE_DIR}"
      DSL_FILE="${DSL_FILE_DIR}/${PRODUCT}.yaml"

      python3 - <<PYEOF
      import io, re
      from pathlib import Path
      from ruamel.yaml import YAML
      from ruamel.yaml.scalarstring import DoubleQuotedScalarString as DQ

      yaml = YAML()
      yaml.preserve_quotes = True
      yaml.explicit_start = True
      yaml.width = 4096
      yaml.indent(mapping=2, sequence=4, offset=2)

      path = Path("${DSL_FILE}")
      service = "${PROJECT_NAME}"

      entry = {
          "name": DQ(service),
          "deploy_type": "helm",
          "pipeline": "cicd",
      }

      if path.exists():
          with path.open() as f:
              data = yaml.load(f) or {}
      else:
          data = {}
      products = data.get("products") or []
      # Продукт вносится в job-dsl ОДИН раз. Если уже есть — ничего не меняем
      # (даже при перераскатках): файл не трогаем, MR не создаётся.
      if any(p.get("name") == service for p in products):
          print(f"{service} уже зарегистрирован в job-dsl — изменений не вносим")
      else:
          products.append(entry)
          data["products"] = products
          data.setdefault("conf", {}).setdefault("parameters", {}).setdefault("FORCE", False)
          # Дамп в строку, затем вставляем пустую строку перед каждым продуктом
          # (кроме первого) — чтобы блоки в products разделялись пробелом.
          buf = io.StringIO()
          yaml.dump(data, buf)
          lines = buf.getvalue().split("\n")
          item_re = re.compile(r"^\s*-\s+name:")
          out, first = [], True
          for line in lines:
              if item_re.match(line):
                  if first:
                      first = False
                  elif out and out[-1].strip():
                      out.append("")
              out.append(line)
          path.write_text("\n".join(out))
          print(f"{service} добавлен в job-dsl")
      PYEOF

      git add "${DSL_FILE}"
      if git diff --cached --quiet; then
        echo "Нет изменений в ${DSL_FILE} — MR не требуется"
        exit 0
      fi

      git commit -m "feat: register ${PROJECT_NAME} in job-dsl"
      git push \
        -o merge_request.create \
        -o merge_request.target="${DSL_TARGET_BRANCH}" \
        -o merge_request.title="feat: register ${PROJECT_NAME} in job-dsl" \
        origin "${FEATURE_BRANCH}"

      # Держим resource_group-слот, ПОКА MR не приземлится в master (продукт
      # появился). Иначе следующая job ответвится от master без нашей правки →
      # конфликт. Пуллим master до появления "${PROJECT_NAME}".
      DSL_URL="https://${UNIXREPO_USER}:${MF_BDATA_TUZ_PASSWORD}@cicd-git.megafon.ru/${DSL_REPO_PATH}.git"
      echo "Ждём слияния MR — появления ${PROJECT_NAME} в ${DSL_TARGET_BRANCH}..."
      i=0
      until rm -rf /tmp/dsl-verify && \
            git clone -q --depth 1 --branch "${DSL_TARGET_BRANCH}" "${DSL_URL}" /tmp/dsl-verify 2>/dev/null && \
            grep -q "\"${PROJECT_NAME}\"" "/tmp/dsl-verify/${DSL_FILE}" 2>/dev/null; do
        i=$((i+1))
        if [ "$i" -gt 60 ]; then
          echo "WARN: ${PROJECT_NAME} не появился в ${DSL_TARGET_BRANCH} за ~5 мин — продолжаем"
          break
        fi
        echo "  ещё не слит, ждём... (попытка $i)"
        sleep 5
      done
      rm -rf /tmp/dsl-verify
      [ "$i" -le 60 ] && echo "OK: ${PROJECT_NAME} в ${DSL_TARGET_BRANCH}"


# ============================================================================
# ЗАВЕДЕНИЕ REDIS-УЧЁТКИ (action=create + redis_enabled=true)
# Общий standalone-Redis обслуживает много продуктов; учётки хранятся в одном
# файле .gitlab/genai-users.yml (ACL) целевого repo. Джоба:
#   1) заводит CI/CD-переменные REDIS_<PRODUCT>_USER / _USER_PASSWORD во всех
#      environment_scope, что уже есть в redis-репо (у каждого окружения свой
#      случайный masked-пароль, create-only — повторный запуск не ротирует);
#   2) добавляет ACL-блок пользователя в genai-users.yml (средний/безопасный набор);
#   3) пушит ветку feature/<product>, открывает MR в дефолтную ветку redis-репо
#      и авто-прожимает manual-джобы стейджа deploy_standalone на пайплайне ветки.
# ПРЕДУСЛОВИЕ: у ТУЗа (GITLAB_TUZ_TOKEN / UNIXREPO_USER) должен быть Maintainer на
# redis-репо — иначе управление CI/CD Variables вернёт 403.
# ============================================================================
redis-user:
  stage: redis-user
  image: $CI_IMAGE
  # Последовательная запись в общий users.acl из разных пайплайнов — по одному.
  resource_group: "redis-genai-users"
  needs:
    - job: validate-params
      artifacts: true
  rules:
    - if: $ACTION == "create" && $REDIS_ENABLED == "true"
  variables:
    REDIS_REPO_PATH: "middle/itbigdata/devops_tools/docker-compose-manifests/redis"
    REDIS_USERS_FILE: ".gitlab/genai-users.yml"
    REDIS_FALLBACK_BRANCH: "master"
  before_script:
    - !reference [.unixrepo_configuration, auth_apk]
    - apk add --no-cache git python3
    - git config --global user.email "it-reporting-deployment-devops@megafon.ru"
    - git config --global user.name "CICD Generator"
  script:
    - |
      set -e
      # Имя переменной: UPPER + '-'/'.' → '_' (как у существующих: SVC_COST_SCAN, RMP_GENAI, ...)
      PRODUCT_UPPER=$(echo "$PROJECT_NAME" | tr 'a-z' 'A-Z' | tr '.-' '__')
      REDIS_LOGIN="$PROJECT_NAME"                 # redis-логин = имя продукта (нижний регистр)
      USER_VAR="REDIS_${PRODUCT_UPPER}_USER"
      PASS_VAR="REDIS_${PRODUCT_UPPER}_USER_PASSWORD"
      REPO_ENC=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['REDIS_REPO_PATH'],safe=''))")
      API="${GITLAB_URL}/api/v4/projects/${REPO_ENC}"
      echo "=== Redis genai-user: продукт ${PROJECT_NAME} → ${USER_VAR} ==="

      # --- 1) CI/CD Variables: USER + PASSWORD во всех существующих environment_scope ---
      export GEN_TOKEN="${GITLAB_TUZ_TOKEN}" GEN_API="${API}" \
             GEN_USER_VAR="${USER_VAR}" GEN_PASS_VAR="${PASS_VAR}" \
             GEN_LOGIN="${REDIS_LOGIN}"
      python3 - <<'PYEOF'
      import os, json, secrets, urllib.request, urllib.parse, urllib.error
      TOKEN = os.environ['GEN_TOKEN']; API = os.environ['GEN_API']

      def call(method, url, data=None):
          body = urllib.parse.urlencode(data).encode() if data else None
          req = urllib.request.Request(url, data=body, method=method)
          req.add_header('PRIVATE-TOKEN', TOKEN)
          try:
              with urllib.request.urlopen(req) as r:
                  return r.status, r.read().decode()
          except urllib.error.HTTPError as e:
              return e.code, e.read().decode()

      # Уникальные environment_scope существующих переменных репо
      scopes, page = set(), 1
      while True:
          st, body = call('GET', f"{API}/variables?per_page=100&page={page}")
          if st != 200:
              print(f"WARN: не удалось прочитать переменные (HTTP {st}): {body[:200]}")
              break
          arr = json.loads(body)
          if not arr:
              break
          for v in arr:
              scopes.add(v.get('environment_scope', '*'))
          if len(arr) < 100:
              break
          page += 1
      if not scopes:
          scopes = {'*'}
      print("environment scopes:", sorted(scopes))

      def upsert(key, value, masked, scope, overwrite):
          data = {'key': key, 'value': value, 'environment_scope': scope,
                  'masked': str(masked).lower(), 'protected': 'false',
                  'variable_type': 'env_var'}
          st, body = call('POST', f"{API}/variables", data)
          if st in (200, 201):
              print(f"  + {key} @ {scope}")
              return
          # POST 400 → переменная с таким key+scope уже есть
          if not overwrite:
              print(f"  = {key} @ {scope} (уже есть — не трогаем)")
              return
          flt = urllib.parse.urlencode({'filter[environment_scope]': scope})
          st2, body2 = call('PUT', f"{API}/variables/{key}?{flt}",
                            {'value': value, 'environment_scope': scope,
                             'masked': str(masked).lower(), 'protected': 'false'})
          if st2 in (200, 201):
              print(f"  ~ {key} @ {scope} (обновлён)")
          else:
              raise SystemExit(f"ERROR {key} @ {scope}: POST {st} {body[:200]} | PUT {st2} {body2[:200]}")

      user_var = os.environ['GEN_USER_VAR']
      pass_var = os.environ['GEN_PASS_VAR']
      login = os.environ['GEN_LOGIN']
      for sc in sorted(scopes):
          # Логин детерминирован → можно обновлять. Пароль у КАЖДОГО окружения свой,
          # генерится случайно и заводится один раз (create-only): повторный запуск
          # генератора не ротирует уже заведённый пароль (иначе сломался бы users.acl
          # до передеплоя соответствующего окружения).
          upsert(user_var, login, False, sc, overwrite=True)
          upsert(pass_var, secrets.token_hex(24), True, sc, overwrite=False)
      PYEOF

      # --- 2) genai-users.yml: ACL-блок пользователя + ветка + MR ---
      FEATURE_BRANCH="feature/${PROJECT_NAME}"
      git clone "https://${UNIXREPO_USER}:${MF_BDATA_TUZ_PASSWORD}@cicd-git.megafon.ru/${REDIS_REPO_PATH}.git" redis-repo
      cd redis-repo
      DEFAULT_BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null || echo "${REDIS_FALLBACK_BRANCH}")
      git checkout "${FEATURE_BRANCH}" 2>/dev/null || git checkout -b "${FEATURE_BRANCH}"

      export GEN_USER_VAR="${USER_VAR}" GEN_PASS_VAR="${PASS_VAR}" \
             GEN_KEYSPACE="${PROJECT_NAME}" GEN_USERS_FILE="${REDIS_USERS_FILE}"
      python3 - <<'PYEOF'
      import os, re
      from pathlib import Path

      user_var = os.environ['GEN_USER_VAR']
      pass_var = os.environ['GEN_PASS_VAR']
      keyspace = os.environ['GEN_KEYSPACE']
      path = Path(os.environ['GEN_USERS_FILE'])

      # Средний/безопасный ACL-набор: база strings/lists/pub-sub/TTL/transactions + hash.
      # keyspace ~<product>*. Без @admin/@dangerous/keys/flush.
      perms = ("-@all +@transaction +select +expire +persist +rpush +del +psubscribe "
               "+exists +llen +lrange +set -discard +lrem +ttl +setex +ltrim +ping "
               "+punsubscribe +get +hget +hset +cluster|slots")

      # Дописываем блок как ЧИСТЫЙ ТЕКСТ (без ruamel round-trip). Перевыгрузка YAML
      # реформатит соседние блоки (меняет |→|-, чоппинг), поэтому парсинг НЕ используем —
      # существующие элементы списка остаются байт-в-байт.
      text = path.read_text()
      needle = f"${{{user_var}}}"
      if needle in text:
          print(f"{user_var} уже есть в genai-users.yml — правку не вносим")
      else:
          m = re.search(r'^(\s*)-\s*\|', text, re.M)   # отступ элементов по первому '- |'
          dash = m.group(1) if m else '    '
          body = dash + '  '
          item = "\n".join([
              f"{dash}- |",
              f'{body}if [[ -n "${{{user_var}}}" ]] && [[ -n "${{{pass_var}}}" ]]; then',
              f"{body}cat << EOF >> configs/redis/users.acl",
              f"{body}user ${{{user_var}}} on >${{{pass_var}}} ~{keyspace}* {perms}",
              f"{body}EOF",
              f"{body}fi",
          ])
          if not text.endswith("\n"):
              text += "\n"
          path.write_text(text + item + "\n")
          print(f"{user_var} добавлен в genai-users.yml")
      PYEOF

      git add "${REDIS_USERS_FILE}"
      if git diff --cached --quiet; then
        echo "Нет изменений в ${REDIS_USERS_FILE} — MR не требуется (пользователь уже заведён)"
        exit 0
      fi

      MR_DESC="Автоматическое заведение Redis-учётки для нового продукта ${PROJECT_NAME} (группа ${TARGET_GROUP_NAME}). Добавлен пользователь ${USER_VAR} в genai-users.yml — базовый ACL (strings/lists/hash/pub-sub/TTL/transactions), keyspace ~${PROJECT_NAME}*. CI/CD-переменные ${USER_VAR}/${PASS_VAR} заведены во всех окружениях (в каждом окружении свой случайный пароль). Деплой (stage deploy_standalone) запущен автоматически с этой ветки."
      git commit -m "feat: redis genai-user для ${PROJECT_NAME}"
      git push \
        -o merge_request.create \
        -o merge_request.target="${DEFAULT_BRANCH}" \
        -o merge_request.title="feat: redis genai-user для ${PROJECT_NAME}" \
        -o merge_request.description="${MR_DESC}" \
        origin "${FEATURE_BRANCH}"
      echo "OK: ветка ${FEATURE_BRANCH} запушена, MR в ${DEFAULT_BRANCH} открыт"

      # --- 3) Авто-прожатие manual-джоб стейджа deploy_standalone на пайплайне ветки ---
      export GEN_TOKEN="${GITLAB_TUZ_TOKEN}" GEN_API="${API}" GEN_REF="${FEATURE_BRANCH}"
      python3 - <<'PYEOF'
      import os, json, time, urllib.request, urllib.parse, urllib.error
      TOKEN = os.environ['GEN_TOKEN']; API = os.environ['GEN_API']; REF = os.environ['GEN_REF']
      STAGE = 'deploy_standalone'

      def call(method, url):
          req = urllib.request.Request(url, method=method)
          req.add_header('PRIVATE-TOKEN', TOKEN)
          try:
              with urllib.request.urlopen(req) as r:
                  return r.status, r.read().decode()
          except urllib.error.HTTPError as e:
              return e.code, e.read().decode()

      # 1) дождаться появления пайплайна ветки (push его создаёт)
      q = urllib.parse.urlencode({'ref': REF, 'order_by': 'id', 'sort': 'desc', 'per_page': 1})
      pid = None
      for _ in range(60):
          st, body = call('GET', f"{API}/pipelines?{q}")
          arr = json.loads(body) if st == 200 else []
          if arr:
              pid = arr[0]['id']
              break
          time.sleep(5)
      if not pid:
          raise SystemExit("ERROR: пайплайн ветки не появился за ~5 мин")
      print(f"pipeline #{pid} для {REF}")

      # 2) прожимать manual-джобы стейджа в несколько проходов: часть становится
      #    доступной только после запуска предшественников (needs). Ждём терминала.
      played = set()
      for _ in range(60):                       # ~15 мин макс (sleep 15)
          st, body = call('GET', f"{API}/pipelines/{pid}/jobs?per_page=100")
          jobs = json.loads(body) if st == 200 else []
          stage_jobs = [j for j in jobs if j.get('stage') == STAGE]
          for j in stage_jobs:
              if j.get('status') == 'manual' and j['id'] not in played:
                  ps, pb = call('POST', f"{API}/jobs/{j['id']}/play")
                  if ps in (200, 201):
                      played.add(j['id']); print(f"  ▶ play {j['name']} (#{j['id']})")
                  else:
                      print(f"  ! {j['name']} (#{j['id']}): HTTP {ps} {pb[:150]}")
          transient = [j for j in stage_jobs if j.get('status') in ('manual', 'created', 'pending', 'running')]
          if stage_jobs and not transient:
              break
          time.sleep(15)

      st, body = call('GET', f"{API}/pipelines/{pid}/jobs?per_page=100")
      jobs = json.loads(body) if st == 200 else []
      summary = [(j['name'], j['status']) for j in jobs if j.get('stage') == STAGE]
      print("Итог deploy_standalone:", summary)
      if not summary:
          print("WARN: в пайплайне ветки не найден стейдж deploy_standalone — проверь конфиг redis-репо")
      failed = [n for n, s in summary if s == 'failed']
      if failed:
          raise SystemExit(f"ERROR: упали джобы deploy_standalone: {failed}")
      print(f"Прожато джоб: {len(played)}")
      PYEOF


# ============================================================================
# ЗАВЕДЕНИЕ POSTGRESQL-УЧЁТКИ (action=create + pg_enabled=true, пока только dev)
# Postgres крутится в docker на VM vlg-bdata-llmgpu03. Джоба ходит по SSH под
# bdata-ТУЗом (логин+пароль) → sudo docker exec → psql и создаёт роль + БД +
# гранты. Идемпотентно: роль create-only (на повторном запуске пароль НЕ
# меняется, чтобы не разъехаться с PAM); БД create-only; гранты — всегда.
# Сгенерированный пароль печатается в лог — DevOps вручную кладут username/
# password в PAM по пути /MegaFon/Common/Data-Analytics/dev/<PAM_SOURCE>/
# <project>_postgres_db_password (свойства username/password), откуда приложение
# читает их через ExternalSecret.
# ПРЕДУСЛОВИЕ: у bdata-ТУЗа есть SSH-доступ на хост и sudo для docker.
# ============================================================================
pg-user:
  stage: pg-user
  image: $CI_IMAGE
  resource_group: "pg-llmgpu-dev"
  needs:
    - job: validate-params
      artifacts: true
  rules:
    - if: $ACTION == "create" && $PG_ENABLED == "true"
  variables:
    PG_SSH_HOST: "vlg-bdata-llmgpu03"
    PG_CONTAINER: "postgres-llmgpu-dev_postgres"
    PG_STAND: "dev"
    # Логин/пароль SSH = bdata-ТУЗ (те же, что для git basic-auth). При необходимости
    # переопредели PG_SSH_USER / PG_SSH_PASSWORD в Settings → CI/CD → Variables.
    PG_SSH_USER: "${UNIXREPO_USER}"
    PG_SSH_PASSWORD: "${MF_BDATA_TUZ_PASSWORD}"
  before_script:
    - !reference [.unixrepo_configuration, auth_apk]
    - apk add --no-cache openssh-client sshpass
  script:
    - |
      set -e
      # --- Нормализация: PG-идентификатор (роль=БД) из имени продукта ---
      PG_NAME=$(echo "$PROJECT_NAME" | tr 'A-Z' 'a-z' | tr '.-' '__')
      if ! echo "$PG_NAME" | grep -qE '^[a-z0-9][a-z0-9_]*$'; then
        echo "ERROR: не удалось построить безопасное PG-имя из '${PROJECT_NAME}'"; exit 1
      fi
      case "$PG_NAME" in
        postgres|template0|template1|root|admin)
          echo "ERROR: имя '${PG_NAME}' зарезервировано — отказ"; exit 1;;
      esac
      # Случайный пароль (48 hex) — безопасен как SQL-литерал. head-c читает РОВНО
      # 24 байта из файла и выходит (0) → нет SIGPIPE (в отличие от tr</dev/urandom|head,
      # который под pipefail роняет джобу кодом 141).
      PG_PASSWORD=$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')
      SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=15"
      export SSHPASS="$PG_SSH_PASSWORD"   # sshpass -e: пароль из env, не в argv раннера
      echo "=== PostgreSQL: продукт ${PROJECT_NAME} → роль/БД ${PG_NAME} на ${PG_CONTAINER} (${PG_STAND}) ==="

      # SSH → sudo docker exec → psql. Роль/БД идемпотентны через \gexec;
      # гранты выполняются всегда (повтор безопасен). Идентификаторы и литералы
      # подставляются через psql-переменные :'role'/:"role"/:'pwd' — без инъекций.
      OUT=$(sshpass -e ssh $SSHOPTS "${PG_SSH_USER}@${PG_SSH_HOST}" 'bash -s' <<REMOTE
      set -e
      echo '$PG_SSH_PASSWORD' | sudo -S -p '' -v 2>/dev/null || true
      CID=\$(sudo docker ps --filter name='$PG_CONTAINER' --format '{{.ID}}' | head -n1)
      if [ -z "\$CID" ]; then echo 'ERR_NO_CONTAINER'; exit 3; fi
      sudo docker exec -i "\$CID" psql -U postgres -v ON_ERROR_STOP=1 <<'PSQL'
      \set role '$PG_NAME'
      \set pwd '$PG_PASSWORD'
      SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'role', :'pwd') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role')\gexec
      SELECT format('CREATE DATABASE %I OWNER %I', :'role', :'role') WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'role')\gexec
      GRANT ALL PRIVILEGES ON DATABASE :"role" TO :"role";
      \connect :"role"
      GRANT ALL ON SCHEMA public TO :"role";
      GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO :"role";
      GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO :"role";
      PSQL
      REMOTE
      ) || { echo "$OUT"; echo "ERROR: SSH/psql завершились с ошибкой"; exit 1; }
      echo "$OUT"

      case "$OUT" in
        *ERR_NO_CONTAINER*)
          echo "ERROR: контейнер '${PG_CONTAINER}' не найден на ${PG_SSH_HOST}"; exit 1;;
      esac

      echo ""
      echo "======================================================================"
      case "$OUT" in
        *"CREATE ROLE"*)
          echo "  PostgreSQL-учётка СОЗДАНА. Перенесите в PAM ВРУЧНУЮ:"
          echo "    путь: /MegaFon/Common/Data-Analytics/${PG_STAND}/${PAM_SOURCE}/${PROJECT_NAME}_postgres_db_password"
          echo "    property username = ${PG_NAME}"
          echo "    property password = ${PG_PASSWORD}"
          ;;
        *)
          echo "  Роль ${PG_NAME} уже существовала — пароль НЕ менялся (в PAM оставьте текущий)."
          echo "  База и гранты приведены к нужному состоянию."
          ;;
      esac
      echo "======================================================================"


# ============================================================================
# РЕЖИМ УДАЛЕНИЯ (action=delete)
# Цель задаётся теми же полями, что и при создании: project_name + target_group_name.
# При action=delete ВСЕ обычные джобы исключены (rules: $ACTION == "create"),
# выполняется только этот job: удаление репозиториев middle + middleconf и
# строки из job-dsl. Сама группа НЕ удаляется (в ней могут быть другие проекты).
# Требует подтверждения паролем: input delete_password должен совпасть с
# masked CI-переменной DELETE_PASSWORD (Settings → CI/CD → Variables).
# ============================================================================
delete-repository:
  stage: delete
  image: $CI_IMAGE
  # Тот же слот, что и у register-in-dsl: запись в nmf-job-dsl (create + delete)
  # сериализуется глобально → параллельное удаление/создание не конфликтует.
  resource_group: "nmf-job-dsl"
  rules:
    - if: $ACTION == "delete"
  variables:
    DSL_REPO_PATH: "libs/cicd/nmf/nmf-job-dsl"
    DSL_FILE_DIR: "middle/itbigdata"
    DSL_TARGET_BRANCH: "master"
  before_script:
    - !reference [.unixrepo_configuration, auth_apk]
    - apk add --no-cache curl jq git python3 py3-ruamel.yaml
    - git config --global user.email "it-reporting-deployment-devops@megafon.ru"
    - git config --global user.name "CICD Generator"
  script:
    - |
      # --- Валидация цели (в режиме delete validate-params не запускается) ---
      [ -z "$PROJECT_NAME" ] && echo "ERROR: при action=delete заполните project_name (имя удаляемого репозитория)" && exit 1
      if ! echo "$PROJECT_NAME" | grep -qE '^[a-z0-9][a-z0-9._-]*$'; then
        echo "ERROR: project_name: только a-z, 0-9, ., -, _"
        exit 1
      fi
      if ! echo "$TARGET_GROUP_NAME" | grep -qE '^[a-z0-9][a-z0-9._-]*$'; then
        echo "ERROR: target_group_name: только a-z, 0-9, ., -, _"
        exit 1
      fi

      # --- Проверка пароля ---
      # DELETE_PASSWORD — masked CI-переменная (задаётся в Settings → CI/CD).
      # Без неё удаление запрещено в принципе.
      if [ -z "$DELETE_PASSWORD" ]; then
        echo "ERROR: masked CI-переменная DELETE_PASSWORD не задана — удаление запрещено."
        echo "Задайте её в Settings → CI/CD → Variables (masked)."
        exit 1
      fi
      if [ "$DELETE_PASSWORD_INPUT" != "$DELETE_PASSWORD" ]; then
        echo "ERROR: неверный пароль удаления."
        exit 1
      fi

      PRODUCT="${PRODUCT_NAME:-$TARGET_GROUP_NAME}"

      RED=$(printf '\033[31m'); BOLD=$(printf '\033[1m'); RESET=$(printf '\033[0m')

      # --- Баннер: что именно будет удалено ---
      echo "${RED}${BOLD}========================================${RESET}"
      echo "${RED}${BOLD}  РЕЖИМ УДАЛЕНИЯ${RESET}"
      echo "${RED}  middle    : middle/itbigdata/${TARGET_GROUP_NAME}/${PROJECT_NAME}${RESET}"
      echo "${RED}  middleconf: middleconf/itbigdata/${TARGET_GROUP_NAME}/${PROJECT_NAME}${RESET}"
      echo "${RED}  job-dsl   : middle/itbigdata/${PRODUCT}.yaml → продукт \"${PROJECT_NAME}\"${RESET}"
      echo "${RED}  (группа ${TARGET_GROUP_NAME} НЕ удаляется)${RESET}"
      echo "${RED}${BOLD}========================================${RESET}"

      # --- Удаление проектов middle + middleconf ---
      # middle и middleconf — независимые root-группы с разными ТУЗами.
      delete_project() {
        parent="$1"; token="$2"
        proj_path="${parent}/itbigdata/${TARGET_GROUP_NAME}/${PROJECT_NAME}"
        enc=$(echo "$proj_path" | sed 's|/|%2F|g')
        [ -z "$token" ] && echo "ERROR: пустой токен для ${parent}" && exit 1

        code=$(curl -s -o /dev/null -w "%{http_code}" \
          --header "PRIVATE-TOKEN: ${token}" \
          "${GITLAB_URL}/api/v4/projects/${enc}")
        if [ "$code" = "404" ]; then
          echo "INFO: ${proj_path} не найден (уже удалён?) — пропуск"
          return 0
        fi

        resp=$(curl -s -w "\n%{http_code}" --request DELETE \
          --header "PRIVATE-TOKEN: ${token}" \
          "${GITLAB_URL}/api/v4/projects/${enc}")
        dcode=$(echo "$resp" | tail -n1)
        # 202 Accepted — удаление принято (GitLab удаляет асинхронно)
        if [ "$dcode" = "202" ] || [ "$dcode" = "200" ] || [ "$dcode" = "204" ]; then
          echo "OK: удаление ${proj_path} принято (HTTP ${dcode})"
        elif [ "$dcode" = "403" ]; then
          echo "ERROR удаления ${proj_path}: HTTP 403 Forbidden"
          echo "$resp" | sed '$d'
          echo "Причина: у ТУЗа недостаточно прав. Удаление проекта в GitLab требует роли Owner"
          echo "(или включённой в группе опции 'Maintainers can delete projects') + scope 'api' у токена."
          echo "Выдайте ТУЗу роль Owner на группе ${parent}/itbigdata и повторите."
          exit 1
        else
          echo "ERROR удаления ${proj_path} (HTTP ${dcode}):"
          echo "$resp" | sed '$d'
          exit 1
        fi
      }

      delete_project middle     "${GITLAB_TUZ_TOKEN}"
      delete_project middleconf "${GITLAB_MIDDLECONF_TUZ_TOKEN}"

      # --- Удаление строки продукта из job-dsl (через MR) ---
      FEATURE_BRANCH="feature/delete-${PROJECT_NAME}"
      git clone --branch "${DSL_TARGET_BRANCH}" \
        "https://${UNIXREPO_USER}:${MF_BDATA_TUZ_PASSWORD}@cicd-git.megafon.ru/${DSL_REPO_PATH}.git" dsl-repo
      cd dsl-repo
      git checkout "${FEATURE_BRANCH}" 2>/dev/null || git checkout -b "${FEATURE_BRANCH}"
      DSL_FILE="${DSL_FILE_DIR}/${PRODUCT}.yaml"

      if [ ! -f "$DSL_FILE" ]; then
        echo "INFO: ${DSL_FILE} отсутствует — нечего удалять из job-dsl"
        exit 0
      fi

      python3 - <<PYEOF
      import io, re
      from pathlib import Path
      from ruamel.yaml import YAML

      yaml = YAML()
      yaml.preserve_quotes = True
      yaml.explicit_start = True
      yaml.width = 4096
      yaml.indent(mapping=2, sequence=4, offset=2)

      path = Path("${DSL_FILE}")
      service = "${PROJECT_NAME}"

      with path.open() as f:
          data = yaml.load(f) or {}
      products = data.get("products") or []
      kept = [p for p in products if p.get("name") != service]
      if len(kept) == len(products):
          print(f"{service} не найден в job-dsl — изменений нет")
      else:
          data["products"] = kept
          # Та же нормализация, что и при добавлении: пустая строка перед каждым
          # продуктом (кроме первого) — иначе оставшиеся блоки склеятся без пробела.
          buf = io.StringIO()
          yaml.dump(data, buf)
          lines = buf.getvalue().split("\n")
          item_re = re.compile(r"^\s*-\s+name:")
          out, first = [], True
          for line in lines:
              if item_re.match(line):
                  if first:
                      first = False
                  elif out and out[-1].strip():
                      out.append("")
              out.append(line)
          path.write_text("\n".join(out))
          print(f"{service} удалён из job-dsl")
      PYEOF

      git add "${DSL_FILE}"
      if git diff --cached --quiet; then
        echo "Нет изменений в ${DSL_FILE} — MR не требуется"
        exit 0
      fi

      git commit -m "chore: remove ${PROJECT_NAME} from job-dsl"
      git push \
        -o merge_request.create \
        -o merge_request.target="${DSL_TARGET_BRANCH}" \
        -o merge_request.title="chore: remove ${PROJECT_NAME} from job-dsl" \
        origin "${FEATURE_BRANCH}"

      # Держим resource_group-слот, ПОКА MR не приземлится в master (продукт
      # реально удалён). Без этого параллельное удаление ловит конфликт мёржа:
      # следующая job ответвляется от master, куда наша правка ещё не доехала.
      # Пуллим master, пока "${PROJECT_NAME}" не исчезнет.
      DSL_URL="https://${UNIXREPO_USER}:${MF_BDATA_TUZ_PASSWORD}@cicd-git.megafon.ru/${DSL_REPO_PATH}.git"
      echo "Ждём слияния MR — удаления ${PROJECT_NAME} из ${DSL_TARGET_BRANCH}..."
      i=0
      while rm -rf /tmp/dsl-verify && \
            git clone -q --depth 1 --branch "${DSL_TARGET_BRANCH}" "${DSL_URL}" /tmp/dsl-verify 2>/dev/null && \
            grep -q "\"${PROJECT_NAME}\"" "/tmp/dsl-verify/${DSL_FILE}" 2>/dev/null; do
        i=$((i+1))
        if [ "$i" -gt 60 ]; then
          echo "WARN: ${PROJECT_NAME} всё ещё в ${DSL_TARGET_BRANCH} спустя ~5 мин — проверьте MR"
          break
        fi
        echo "  ещё не удалён, ждём... (попытка $i)"
        sleep 5
      done
      rm -rf /tmp/dsl-verify
      [ "$i" -le 60 ] && echo "OK: ${PROJECT_NAME} удалён из ${DSL_TARGET_BRANCH}"


# ============================================================================
# УДАЛЕНИЕ REDIS-УЧЁТКИ (action=delete)
# Симметрично redis-user: при удалении приложения убираем его Redis-учётку —
#   1) удаляем CI/CD-переменные REDIS_<PRODUCT>_USER / _USER_PASSWORD во всех scope;
#   2) удаляем ACL-блок пользователя из .gitlab/genai-users.yml (ветка + MR);
#   3) авто-прожимаем deploy_standalone, чтобы users.acl перегенерился без юзера.
# Идемпотентно: если учётки/переменных нет — просто пропускаем (для приложений
# без Redis джоба отработает вхолостую). Под тем же паролем-подтверждением
# (DELETE_PASSWORD), что и удаление репозиториев.
# ============================================================================
redis-user-delete:
  stage: delete
  image: $CI_IMAGE
  resource_group: "redis-genai-users"
  needs: []
  rules:
    - if: $ACTION == "delete"
  variables:
    REDIS_REPO_PATH: "middle/itbigdata/devops_tools/docker-compose-manifests/redis"
    REDIS_USERS_FILE: ".gitlab/genai-users.yml"
    REDIS_FALLBACK_BRANCH: "master"
  before_script:
    - !reference [.unixrepo_configuration, auth_apk]
    - apk add --no-cache git python3
    - git config --global user.email "it-reporting-deployment-devops@megafon.ru"
    - git config --global user.name "CICD Generator"
  script:
    - |
      set -e
      # --- Валидация цели (в режиме delete validate-params не запускается) ---
      [ -z "$PROJECT_NAME" ] && echo "ERROR: при action=delete заполните project_name" && exit 1
      echo "$PROJECT_NAME" | grep -qE '^[a-z0-9][a-z0-9._-]*$' || { echo "ERROR: project_name: только a-z, 0-9, ., -, _"; exit 1; }

      # --- Проверка пароля (тот же гейт, что и delete-repository) ---
      if [ -z "$DELETE_PASSWORD" ]; then
        echo "ERROR: masked CI-переменная DELETE_PASSWORD не задана — удаление запрещено."
        exit 1
      fi
      if [ "$DELETE_PASSWORD_INPUT" != "$DELETE_PASSWORD" ]; then
        echo "ERROR: неверный пароль удаления."
        exit 1
      fi

      PRODUCT_UPPER=$(echo "$PROJECT_NAME" | tr 'a-z' 'A-Z' | tr '.-' '__')
      USER_VAR="REDIS_${PRODUCT_UPPER}_USER"
      PASS_VAR="REDIS_${PRODUCT_UPPER}_USER_PASSWORD"
      REPO_ENC=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['REDIS_REPO_PATH'],safe=''))")
      API="${GITLAB_URL}/api/v4/projects/${REPO_ENC}"
      echo "=== Удаление Redis-учётки: продукт ${PROJECT_NAME} → ${USER_VAR} ==="

      # --- 1) CI/CD Variables: удалить USER + PASSWORD во всех scope, где они есть ---
      export GEN_TOKEN="${GITLAB_TUZ_TOKEN}" GEN_API="${API}" \
             GEN_USER_VAR="${USER_VAR}" GEN_PASS_VAR="${PASS_VAR}"
      python3 - <<'PYEOF'
      import os, json, urllib.request, urllib.parse, urllib.error
      TOKEN = os.environ['GEN_TOKEN']; API = os.environ['GEN_API']
      keys = {os.environ['GEN_USER_VAR'], os.environ['GEN_PASS_VAR']}

      def call(method, url):
          req = urllib.request.Request(url, method=method)
          req.add_header('PRIVATE-TOKEN', TOKEN)
          try:
              with urllib.request.urlopen(req) as r:
                  return r.status, r.read().decode()
          except urllib.error.HTTPError as e:
              return e.code, e.read().decode()

      # собрать (key, scope) существующих переменных для наших ключей
      found, page = [], 1
      while True:
          st, body = call('GET', f"{API}/variables?per_page=100&page={page}")
          if st != 200:
              print(f"WARN: не удалось прочитать переменные (HTTP {st}): {body[:200]}")
              break
          arr = json.loads(body)
          if not arr:
              break
          for v in arr:
              if v.get('key') in keys:
                  found.append((v['key'], v.get('environment_scope', '*')))
          if len(arr) < 100:
              break
          page += 1

      if not found:
          print("  переменных не найдено — пропуск")
      for key, scope in found:
          flt = urllib.parse.urlencode({'filter[environment_scope]': scope})
          st, body = call('DELETE', f"{API}/variables/{key}?{flt}")
          if st in (200, 204):
              print(f"  - {key} @ {scope}")
          elif st == 404:
              print(f"  = {key} @ {scope} (уже нет)")
          else:
              raise SystemExit(f"ERROR delete {key} @ {scope}: HTTP {st} {body[:200]}")
      PYEOF

      # --- 2) genai-users.yml: удалить ACL-блок пользователя ВЕЗДЕ, где он есть ---
      # Запись могла остаться либо в master (create-MR влит), либо только в create-
      # ветке feature/<product> (MR НЕ влит, но деплой с неё уже прожат → в живом
      # redis юзер есть). Чистим оба места и оставшуюся create-ветку удаляем.
      export GEN_USER_VAR="${USER_VAR}" GEN_USERS_FILE="${REDIS_USERS_FILE}"

      # helper: вырезать ACL-блок пользователя в текущем genai-users.yml (чистый текст)
      redis_remove_entry() {
      python3 - <<'PYEOF'
      import os, re
      from pathlib import Path
      user_var = os.environ['GEN_USER_VAR']
      path = Path(os.environ['GEN_USERS_FILE'])
      needle = f"${{{user_var}}}"
      text = path.read_text()
      lines = text.split("\n")
      m = re.search(r'^(\s*)-\s*\|', text, re.M)   # отступ элементов по первому '- |'
      dash = m.group(1) if m else '    '
      item_re = re.compile(r'^' + re.escape(dash) + r'-\s')
      body_prefix = dash + '  '
      out, i, removed, n = [], 0, 0, len(lines)
      while i < n:
          if item_re.match(lines[i]):
              j = i + 1
              blk = [lines[i]]
              while j < n and (lines[j] == '' or lines[j].startswith(body_prefix)):
                  blk.append(lines[j]); j += 1
              if needle in "\n".join(blk):
                  removed += 1
              else:
                  out.extend(blk)
              i = j
          else:
              out.append(lines[i]); i += 1
      if removed:
          res = "\n".join(out)
          if res and not res.endswith("\n"):
              res += "\n"
          path.write_text(res)
      print(f"removed={removed}")
      PYEOF
      }

      # helper: дождаться пайплайна ветки $1 и прожать deploy_standalone до терминала
      redis_play_deploy() {
      export GEN_TOKEN="${GITLAB_TUZ_TOKEN}" GEN_API="${API}" GEN_REF="$1"
      python3 - <<'PYEOF'
      import os, json, time, urllib.request, urllib.parse, urllib.error
      TOKEN = os.environ['GEN_TOKEN']; API = os.environ['GEN_API']; REF = os.environ['GEN_REF']
      STAGE = 'deploy_standalone'

      def call(method, url):
          req = urllib.request.Request(url, method=method)
          req.add_header('PRIVATE-TOKEN', TOKEN)
          try:
              with urllib.request.urlopen(req) as r:
                  return r.status, r.read().decode()
          except urllib.error.HTTPError as e:
              return e.code, e.read().decode()

      q = urllib.parse.urlencode({'ref': REF, 'order_by': 'id', 'sort': 'desc', 'per_page': 1})
      pid = None
      for _ in range(60):
          st, body = call('GET', f"{API}/pipelines?{q}")
          arr = json.loads(body) if st == 200 else []
          if arr:
              pid = arr[0]['id']; break
          time.sleep(5)
      if not pid:
          raise SystemExit("ERROR: пайплайн ветки не появился за ~5 мин")
      print(f"pipeline #{pid} для {REF}")

      played = set()
      for _ in range(60):                       # ~15 мин макс (sleep 15)
          st, body = call('GET', f"{API}/pipelines/{pid}/jobs?per_page=100")
          jobs = json.loads(body) if st == 200 else []
          stage_jobs = [j for j in jobs if j.get('stage') == STAGE]
          for j in stage_jobs:
              if j.get('status') == 'manual' and j['id'] not in played:
                  ps, pb = call('POST', f"{API}/jobs/{j['id']}/play")
                  if ps in (200, 201):
                      played.add(j['id']); print(f"  ▶ play {j['name']} (#{j['id']})")
                  else:
                      print(f"  ! {j['name']} (#{j['id']}): HTTP {ps} {pb[:150]}")
          transient = [j for j in stage_jobs if j.get('status') in ('manual', 'created', 'pending', 'running')]
          if stage_jobs and not transient:
              break
          time.sleep(15)

      st, body = call('GET', f"{API}/pipelines/{pid}/jobs?per_page=100")
      jobs = json.loads(body) if st == 200 else []
      summary = [(j['name'], j['status']) for j in jobs if j.get('stage') == STAGE]
      print("Итог deploy_standalone:", summary)
      if not summary:
          print("WARN: в пайплайне ветки не найден стейдж deploy_standalone — проверь конфиг redis-репо")
      failed = [n for n, s in summary if s == 'failed']
      if failed:
          raise SystemExit(f"ERROR: упали джобы deploy_standalone: {failed}")
      print(f"Прожато джоб: {len(played)}")
      PYEOF
      }

      FEATURE_BRANCH="feature/${PROJECT_NAME}"
      REMOVE_BRANCH="feature/remove-${PROJECT_NAME}"
      git clone "https://${UNIXREPO_USER}:${MF_BDATA_TUZ_PASSWORD}@cicd-git.megafon.ru/${REDIS_REPO_PATH}.git" redis-repo
      cd redis-repo
      DEFAULT_BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null || echo "${REDIS_FALLBACK_BRANCH}")
      DEPLOYED=0

      # --- 2a) master: если запись есть в дефолтной ветке — убрать через MR + деплой ---
      git checkout -q "${DEFAULT_BRANCH}"
      echo "Проверяю ${DEFAULT_BRANCH}..."
      redis_remove_entry
      git add "${REDIS_USERS_FILE}"
      if git diff --cached --quiet; then
        echo "  в ${DEFAULT_BRANCH} записи ${USER_VAR} нет"
      else
        git checkout -q -b "${REMOVE_BRANCH}"
        MR_DESC="Удаление Redis-учётки при удалении продукта ${PROJECT_NAME} (группа ${TARGET_GROUP_NAME}). Убран ${USER_VAR} из genai-users.yml; CI/CD-переменные ${USER_VAR}/${PASS_VAR} удалены во всех окружениях. После слияния deploy_standalone перегенерирует users.acl без этого пользователя."
        git commit -q -m "chore: remove redis genai-user ${PROJECT_NAME}"
        git push \
          -o merge_request.create \
          -o merge_request.target="${DEFAULT_BRANCH}" \
          -o merge_request.title="chore: remove redis genai-user ${PROJECT_NAME}" \
          -o merge_request.description="${MR_DESC}" \
          origin "${REMOVE_BRANCH}"
        echo "  OK: ${REMOVE_BRANCH} запушена, MR в ${DEFAULT_BRANCH} открыт"
        redis_play_deploy "${REMOVE_BRANCH}"
        DEPLOYED=1
      fi

      # --- 2b) оставшаяся create-ветка feature/<product>: почистить, задеплоить, удалить ---
      if git ls-remote --exit-code --heads origin "${FEATURE_BRANCH}" >/dev/null 2>&1; then
        echo "Найдена оставшаяся create-ветка ${FEATURE_BRANCH} — чистим"
        git fetch -q origin "${FEATURE_BRANCH}"
        git checkout -q -B "${FEATURE_BRANCH}" "origin/${FEATURE_BRANCH}"
        redis_remove_entry
        git add "${REDIS_USERS_FILE}"
        if git diff --cached --quiet; then
          echo "  в ${FEATURE_BRANCH} записи ${USER_VAR} нет"
        else
          git commit -q -m "chore: remove redis genai-user ${PROJECT_NAME}"
          git push origin "${FEATURE_BRANCH}"
          # деплой с этой ветки нужен, только если чистый users.acl ещё не раскатан
          if [ "$DEPLOYED" = "0" ]; then
            redis_play_deploy "${FEATURE_BRANCH}"
            DEPLOYED=1
          fi
        fi
        # ветку удаляем ТОЛЬКО после деплоя; её MR закроется автоматически
        git push origin --delete "${FEATURE_BRANCH}"
        echo "  OK: create-ветка ${FEATURE_BRANCH} удалена"
      else
        echo "Оставшейся create-ветки ${FEATURE_BRANCH} нет — ок"
      fi

      if [ "$DEPLOYED" = "0" ]; then
        echo "Учётка ${USER_VAR} нигде в genai-users.yml не найдена — деплой не требовался (переменные уже удалены)."
      fi


# ============================================================================
# УДАЛЕНИЕ POSTGRESQL-УЧЁТКИ (action=delete, пока только dev)
# Симметрично pg-user: при удалении приложения сносим его роль и БД в контейнере.
# БЕЗОПАСНОСТЬ (главное требование): работаем строго по нормализованному имени
# продукта; перед DROP DATABASE проверяем, что владелец базы == наша роль (если
# нет — отказ, ничего не трогаем); дроп только по точному имени + IF EXISTS;
# системные/зарезервированные имена запрещены. Под тем же паролем-подтверждением
# (DELETE_PASSWORD), что и удаление репозиториев. Секрет в PAM удаляется вручную.
# ============================================================================
pg-user-delete:
  stage: delete
  image: $CI_IMAGE
  resource_group: "pg-llmgpu-dev"
  needs: []
  rules:
    - if: $ACTION == "delete"
  variables:
    PG_SSH_HOST: "vlg-bdata-llmgpu03"
    PG_CONTAINER: "postgres-llmgpu-dev_postgres"
    PG_SSH_USER: "${UNIXREPO_USER}"
    PG_SSH_PASSWORD: "${MF_BDATA_TUZ_PASSWORD}"
  before_script:
    - !reference [.unixrepo_configuration, auth_apk]
    - apk add --no-cache openssh-client sshpass
  script:
    - |
      set -e
      # --- Валидация цели + пароль-гейт (тот же, что delete-repository) ---
      [ -z "$PROJECT_NAME" ] && echo "ERROR: при action=delete заполните project_name" && exit 1
      if [ -z "$DELETE_PASSWORD" ]; then
        echo "ERROR: masked CI-переменная DELETE_PASSWORD не задана — удаление запрещено."; exit 1
      fi
      if [ "$DELETE_PASSWORD_INPUT" != "$DELETE_PASSWORD" ]; then
        echo "ERROR: неверный пароль удаления."; exit 1
      fi

      PG_NAME=$(echo "$PROJECT_NAME" | tr 'A-Z' 'a-z' | tr '.-' '__')
      if ! echo "$PG_NAME" | grep -qE '^[a-z0-9][a-z0-9_]*$'; then
        echo "ERROR: не удалось построить безопасное PG-имя из '${PROJECT_NAME}'"; exit 1
      fi
      case "$PG_NAME" in
        postgres|template0|template1|root|admin)
          echo "ERROR: имя '${PG_NAME}' зарезервировано — отказ (защита от сноса системной БД)"; exit 1;;
      esac
      SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=15"
      export SSHPASS="$PG_SSH_PASSWORD"   # sshpass -e: пароль из env, не в argv раннера
      echo "=== Удаление PostgreSQL-учётки: продукт ${PROJECT_NAME} → роль/БД ${PG_NAME} ==="

      # Перед DROP DATABASE сверяем владельца: если база принадлежит не нашей роли
      # (совпало имя, но база чужая) — отказ. Дроп по точному имени + IF EXISTS.
      set +e
      OUT=$(sshpass -e ssh $SSHOPTS "${PG_SSH_USER}@${PG_SSH_HOST}" 'bash -s' <<REMOTE
      set -e
      echo '$PG_SSH_PASSWORD' | sudo -S -p '' -v 2>/dev/null || true
      CID=\$(sudo docker ps --filter name='$PG_CONTAINER' --format '{{.ID}}' | head -n1)
      if [ -z "\$CID" ]; then echo 'ERR_NO_CONTAINER'; exit 3; fi
      OWNER=\$(sudo docker exec -i "\$CID" psql -U postgres -tAc "SELECT pg_catalog.pg_get_userbyid(datdba) FROM pg_database WHERE datname='$PG_NAME'" | tr -d '[:space:]')
      if [ -z "\$OWNER" ]; then
        echo 'DB_ABSENT'
      elif [ "\$OWNER" != '$PG_NAME' ]; then
        echo "ERR_OWNER_MISMATCH:\$OWNER"; exit 4
      else
        sudo docker exec -i "\$CID" psql -U postgres -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='$PG_NAME' AND pid<>pg_backend_pid();" >/dev/null
        sudo docker exec -i "\$CID" psql -U postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS \"$PG_NAME\";"
        echo 'DB_DROPPED'
      fi
      if sudo docker exec -i "\$CID" psql -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='$PG_NAME'" | grep -q 1; then
        sudo docker exec -i "\$CID" psql -U postgres -v ON_ERROR_STOP=1 -c "DROP ROLE IF EXISTS \"$PG_NAME\";"
        echo 'ROLE_DROPPED'
      else
        echo 'ROLE_ABSENT'
      fi
      REMOTE
      )
      rc=$?
      set -e
      echo "$OUT"

      case "$OUT" in
        *ERR_NO_CONTAINER*)
          echo "ERROR: контейнер '${PG_CONTAINER}' не найден на ${PG_SSH_HOST}"; exit 1;;
      esac
      case "$OUT" in
        *ERR_OWNER_MISMATCH*)
          echo "ОТКАЗ: БД ${PG_NAME} принадлежит другому владельцу — не наша, НИЧЕГО не удалено."; exit 1;;
      esac
      if [ "$rc" -ne 0 ]; then
        echo "ERROR: SSH/psql завершились с ошибкой (rc=$rc), см. вывод выше"; exit 1
      fi
      echo "OK: PG-учётка ${PG_NAME} удалена (или уже отсутствовала). Секрет в PAM удалите вручную."
