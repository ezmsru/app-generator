generic:
  deployTimeout: "5m"
  priorityClassName: production

# >>> pam
pam:
  provider: "singleconnect"
  url: "https://pam.megafon.ru"
  aapmSecret: "pam_token_prod_llm"
  secrets:
    # >>> postgres
    # Postgres
    - name: {{PROJECT_NAME}}_postgres_db_password
      secretPath: "/MegaFon/Common/Data-Analytics/prod/{{PROJECT_NAME}}/postgres_db_password"
      property: password
    - name: {{PROJECT_NAME}}_postgres_db_username
      secretPath: "/MegaFon/Common/Data-Analytics/prod/{{PROJECT_NAME}}/postgres_db_password"
      property: username
    # <<< postgres
    # >>> redis
    # Redis
    - name: {{PROJECT_NAME}}_redis_db_password
      secretPath: "/MegaFon/Common/Data-Analytics/prod/{{PROJECT_NAME}}/redis_db_password"
      property: password
    - name: {{PROJECT_NAME}}_redis_db_username
      secretPath: "/MegaFon/Common/Data-Analytics/prod/{{PROJECT_NAME}}/redis_db_password"
      property: username
    # <<< redis
    # >>> s3
    # S3
    - name: {{PROJECT_NAME}}_s3_token
      secretPath: "/MegaFon/Common/Data-Analytics/prod/{{PROJECT_NAME}}/s3_token"
      property: data
    # <<< s3
# <<< pam

deployment:
  replicaCount: 1
  container:
    registry: docker-middle-prod-local.unixrepo.megafon.ru
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 256Mi
    env:
      # APP
      - name: ENV
        value: "PROD"
      - name: APP_NAME
        value: "{{PROJECT_NAME}}"
      - name: APP_ENV
        value: "prod"
      - name: LOG_LEVEL
        value: "warn"

      # >>> postgres
      # Postgres (enabled={{PG_ENABLED}})
      - name: DB_USER
        valueFrom:
          secretKeyRef:
            name: {{PROJECT_NAME}}-secrets-from-pam
            key: {{PROJECT_NAME}}_postgres_db_username
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: {{PROJECT_NAME}}-secrets-from-pam
            key: {{PROJECT_NAME}}_postgres_db_password
      - name: DB_HOST
        value: "{{PG_HOST}}"
      - name: DB_NAME
        value: "{{PG_DB}}"
      - name: DB_PORT
        value: "5432"
      - name: DB_SCHEMA
        value: "public"
      - name: DB_DSN
        value: postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
      - name: DB_ECHO
        value: "false"
      # <<< postgres

      # >>> redis
      # Redis (enabled={{REDIS_ENABLED}})
      - name: REDIS_HOST
        value: "{{REDIS_HOST}}"
      - name: REDIS_PORT
        value: "6379"
      - name: REDIS_DB
        value: "0"
      - name: REDIS_USERNAME
        valueFrom:
          secretKeyRef:
            name: {{PROJECT_NAME}}-secrets-from-pam
            key: {{PROJECT_NAME}}_redis_db_username
      - name: REDIS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: {{PROJECT_NAME}}-secrets-from-pam
            key: {{PROJECT_NAME}}_redis_db_password
      - name: REDIS_USE_SSL
        value: "true"
      - name: REDIS_SSL_CERT_REQS
        value: "none"
      # <<< redis

      # >>> clickhouse
      # ClickHouse (enabled={{CH_ENABLED}})
      - name: CH_HOST
        value: "{{CH_HOST}}"
      - name: CH_DB
        value: "{{CH_DB}}"
      - name: CH_PORT
        value: "8123"
      # <<< clickhouse

      # >>> s3
      # S3 (enabled={{S3_ENABLED}})
      - name: S3_ENDPOINT_URL
        value: "{{S3_ENDPOINT_URL}}"
      - name: S3_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: {{PROJECT_NAME}}-secrets-from-pam
            key: {{PROJECT_NAME}}_s3_token
      - name: S3_SECRET_ACCESS_KEY
        value: ""
      - name: S3_BUCKET
        value: "{{S3_BUCKET}}"
      - name: S3_VERIFY_SSL
        value: "false"
      - name: S3_PREFIX
        value: "{{S3_PREFIX}}"
      # <<< s3
